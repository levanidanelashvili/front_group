<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-10'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Donut shop</title>
    <link rel='stylesheet' href='style.css'>
</head>
<body>
    <h1>Quality Donuts only!</h1>
    <h2>Get them before they sell out!</h2>
    <script src='script.js'></script>

    <div class='image-container'>
    <div class="donut-card">
        <img src='https://freesvg.org/img/donut-with-sprinkles.png' alt='Donut Image'>
        <p class="flavor">Vanilla Donut</p>
        <button class="cart-btn"><span>4.99$</span></button>
    </div>

    <div class="donut-card">
        <img src='https://staging.svgrepo.com/show/298618/donut.svg' alt='Donut Image'>
        <p class="flavor">Chocolate Donut</p>
        <button class="cart-btn"><span>4.50$</span></button>
    </div>

    <div class="donut-card">
        <img src='https://lh5.googleusercontent.com/proxy/Z6Oq3KqUFFsd2k-pR8D0qgz5uhjzQku0DkG3pX1odysf3DHHlMn5PuPVSqdltiYMdQAxALI5w4vQhDAorupZEy7HqI1FkOn_kwYif1e_joGntdweLHPMnkfi_9yIQ1bzPBX-Z0KeuXTmofUttQHcbKfSPTY' class="straw-donut" alt='Donut Image'>
        <p class="flavor">Strawberry Donut</p>
        <button class="cart-btn"><span>5.50$</span></button>
    </div>
</div>

</body>
</html>
